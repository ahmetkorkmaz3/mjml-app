appId: com.mjmlio.mjmlapp

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  # files of the dependencies that the app never reads at run time
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.d.mts'
  - '!**/*.d.cts'
  - '!**/node_modules/**/*.md'
  - '!**/node_modules/**/{test,tests,__tests__,docs,doc,example,examples}/**'

# Electron features that the app does not use are off in the binary
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # the unsigned macOS build gets a new ad hoc signature after the fuses change
  resetAdHocDarwinSignature: true

publish:
  provider: github
  owner: ahmetkorkmaz3
  repo: mjml-app
  releaseType: draft

protocols:
  name: MJML
  schemes:
    - mjmlio

fileAssociations:
  ext: mjml
  name: MJML
  description: MJML email template
  role: Editor
  mimeType: text/x-mjml
  # icon.icns on macOS, icon.ico on Windows
  icon: icon

mac:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  category: public.app-category.utility
  # no Apple Developer ID: the app gets only an ad hoc signature and is not notarized
  identity: null
  # Apple silicon and Intel builds
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

linux:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  category: Development
  maintainer: Ahmet Korkmaz
  synopsis: The desktop app for MJML
  description: Write, preview and export responsive emails with MJML.
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64

# Snap Store package (snap name: mjml-app), built on Linux with snapcraft and LXD:
# `yarn dist:snap`. The Snap workflow uploads it to the store.
snapcraft:
  base: core24
  core24:
    title: MJML
    summary: The desktop app for MJML
    grade: stable
    confinement: strict
    # snapcraft builds the snap in an LXD container
    useLXD: true
    # the gnome extension gives desktop, desktop-legacy, gsettings, opengl, wayland and x11
    plugs:
      - home
      - removable-media
      - network
      # safeStorage keeps the API keys in the keyring of the desktop
      - password-manager-service
      # allow-sandbox needs a manual review of the store, so the app starts with
      # --no-sandbox (electron-builder adds it) and strict confinement isolates it
      - browser-support
    publish:
      provider: snapStore
      channels:
        - candidate

win:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
